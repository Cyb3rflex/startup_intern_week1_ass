<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StartUp_Intern First-Week Assignment</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="both">
      <div class="container">
        <h1>Social media shared today, tomorrow or by location</h1>
        <div class="phone-container">
          <img src="Imgs.png" alt="phone image" />
        </div>
        <img src="Slider dots.png" alt="dots" />
      </div>
      <div class="right_image_container">
        <div class="form-container">
          <div class="logo">
            <img src="Logo.png" alt="Capzul Logo" />
          </div>
          <h1>
            Create account <br />
            <span>For business, band or celebrity.</span>
          </h1>
          <form action="#">
            <div class="form-row">
              <input type="text" placeholder="Name" required />
              <input type="text" placeholder="Last Name" required />
            </div>
            <div class="form-row">
              <input
                type="email"
                placeholder="Email or phone number"
                required />
              <input
                type="text"
                placeholder="Date of birth (MM/DD/YY)"
                required />
            </div>
            <div class="form-row">
              <input type="password" placeholder="Password" required />
              <input type="password" placeholder="Confirm password" required />
            </div>
            <div class="form-options">
              <label class="checkbox-label">
                <input type="checkbox" id="rememberMe" /> Remember me
              </label>
              <a href="#">Forgot password?</a>
            </div>

            <div class="terms">
              <label class="checkbox-label">
                <input type="checkbox" id="terms" required />
                I agree to all the <a href="#">Terms and Privacy policy</a>
              </label>
            </div>

            <div class="btn">
              <button type="submit" class="create-btn">Create account</button>
              <button type="button" class="google-btn">
                <img src="iconfinder_Google_1298745 1.png" alt="" />
                Sign-in with Google
              </button>
            </div>
            <p class="login-option">
              Don't have an account? <a href="#">Log in</a>
            </p>
          </form>
          <div class="store-links">
            <img src="Get the App.png" alt="" />
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
